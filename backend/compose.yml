services:
  mysql:
    image: mysql:8.4
    container_name: grdp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-grdp_root_password}
      MYSQL_DATABASE: grdp_studio
      MYSQL_USER: ${MYSQL_USERNAME:-grdp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-grdp_dev_password}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - grdp_mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: grdp-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-grdp_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - grdp_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD:-grdp_redis_password}
        - ping
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  grdp_mysql_data:
  grdp_redis_data:
