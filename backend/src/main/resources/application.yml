server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: grdp-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/grdp_studio?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:grdp}
    password: ${MYSQL_PASSWORD:grdp_dev_password}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:10}
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

grdp:
  cors:
    allowed-origins: ${GRDP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  integration:
    original-platform:
      base-url: ${ORIGINAL_PLATFORM_BASE_URL:http://127.0.0.1:9920}
      connect-timeout: ${ORIGINAL_PLATFORM_CONNECT_TIMEOUT:5s}
      read-timeout: ${ORIGINAL_PLATFORM_READ_TIMEOUT:60s}
