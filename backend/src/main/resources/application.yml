server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: grdp-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 原平台 Docker 数据库映射到宿主机 32000；与 backend/.env.example 保持一致。
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:32000/database?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:password}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:10}
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.slf4j.Slf4jImpl}
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

grdp:
  cors:
    allowed-origins: ${GRDP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174}
  integration:
    original-platform:
      base-url: ${ORIGINAL_PLATFORM_BASE_URL:http://127.0.0.1:9920}
      connect-timeout: ${ORIGINAL_PLATFORM_CONNECT_TIMEOUT:5s}
      read-timeout: ${ORIGINAL_PLATFORM_READ_TIMEOUT:60s}
  software-integration:
    storage-root: ${SOFTWARE_INTEGRATION_STORAGE_ROOT:C:/GRDP-Data}
    worker-base-url: ${SOFTWARE_INTEGRATION_WORKER_BASE_URL:http://127.0.0.1:5150}
    max-upload-bytes: ${SOFTWARE_INTEGRATION_MAX_UPLOAD_BYTES:524288000}
    default-run-timeout-seconds: ${SOFTWARE_INTEGRATION_RUN_TIMEOUT_SECONDS:600}
    worker-connect-timeout: ${SOFTWARE_INTEGRATION_WORKER_CONNECT_TIMEOUT:10s}
    worker-read-timeout: ${SOFTWARE_INTEGRATION_WORKER_READ_TIMEOUT:30s}
    acceptance-recovery-window: ${SOFTWARE_INTEGRATION_ACCEPTANCE_RECOVERY_WINDOW:30s}
    worker-busy-backoff: ${SOFTWARE_INTEGRATION_WORKER_BUSY_BACKOFF:2s}
    dispatch-delay: ${SOFTWARE_INTEGRATION_DISPATCH_DELAY:500ms}
    poll-delay: ${SOFTWARE_INTEGRATION_POLL_DELAY:500ms}
    dispatcher-enabled: ${SOFTWARE_INTEGRATION_DISPATCHER_ENABLED:true}
    max-artifact-bytes: ${SOFTWARE_INTEGRATION_MAX_ARTIFACT_BYTES:1073741824}
    max-artifact-total-bytes: ${SOFTWARE_INTEGRATION_MAX_ARTIFACT_TOTAL_BYTES:2147483648}
    max-archive-entries: ${SOFTWARE_INTEGRATION_MAX_ARCHIVE_ENTRIES:4096}
    max-archive-depth: ${SOFTWARE_INTEGRATION_MAX_ARCHIVE_DEPTH:32}
    max-archive-entry-bytes: ${SOFTWARE_INTEGRATION_MAX_ARCHIVE_ENTRY_BYTES:1073741824}
    max-archive-expanded-bytes: ${SOFTWARE_INTEGRATION_MAX_ARCHIVE_EXPANDED_BYTES:2147483648}
    validation-sweep-delay: ${SOFTWARE_INTEGRATION_VALIDATION_SWEEP_DELAY:30000}
    validation-sweep-initial-delay: ${SOFTWARE_INTEGRATION_VALIDATION_SWEEP_INITIAL_DELAY:10000}
    validation-recovery-after: ${SOFTWARE_INTEGRATION_VALIDATION_RECOVERY_AFTER:10m}
    validation-lease: ${SOFTWARE_INTEGRATION_VALIDATION_LEASE:5m}
    validation-retry-backoff: ${SOFTWARE_INTEGRATION_VALIDATION_RETRY_BACKOFF:30s}
    validation-max-attempts: ${SOFTWARE_INTEGRATION_VALIDATION_MAX_ATTEMPTS:5}
    artifact-cleanup-delay: ${SOFTWARE_INTEGRATION_ARTIFACT_CLEANUP_DELAY:3600000}
    artifact-cleanup-initial-delay: ${SOFTWARE_INTEGRATION_ARTIFACT_CLEANUP_INITIAL_DELAY:60000}
    project-retention-days: ${SOFTWARE_INTEGRATION_PROJECT_RETENTION_DAYS:30}
    project-cleanup-delay: ${SOFTWARE_INTEGRATION_PROJECT_CLEANUP_DELAY:1h}
    project-cleanup-initial-delay: ${SOFTWARE_INTEGRATION_PROJECT_CLEANUP_INITIAL_DELAY:1m}
