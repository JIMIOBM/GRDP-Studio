spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:grdp_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  data:
    redis:
      host: 127.0.0.1
      port: 6379

management:
  health:
    redis:
      enabled: false
